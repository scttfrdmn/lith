# SPDX-License-Identifier: Apache-2.0
version: 2

project_name: lith

before:
  hooks:
    - go mod tidy

builds:
  - id: lith
    main: ./cmd/lith
    binary: lith
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/scttfrdmn/lith/internal/version.Version={{ .Version }}
      - -X github.com/scttfrdmn/lith/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/scttfrdmn/lith/internal/version.Date={{ .Date }}

archives:
  # Versioned tar.gz archives (the durable, reproducible artifact).
  - id: lith
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Stable-name raw binaries so the docs' copy-pasteable one-liner works
  # unchanged across releases (curl -L .../lith_linux_amd64 -o lith).
  - id: lith-binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Distroless multi-arch image, built from the same binaries as the archives
# above (ids: [lith]) — not a second build path. dockers_v2 builds both
# platforms and pushes one manifest per tag. Tags: the exact version and the
# floating major.minor always; `latest` only on a real release (the empty tag
# from a prerelease is dropped).
dockers_v2:
  - id: lith
    images:
      - ghcr.io/scttfrdmn/lith
    ids: [lith]
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: lith
      org.opencontainers.image.description: Read-only FUSE-over-S3 filesystem and NFSv3 gateway
      org.opencontainers.image.source: https://github.com/scttfrdmn/lith
      org.opencontainers.image.url: https://github.com/scttfrdmn/lith
      org.opencontainers.image.documentation: https://scttfrdmn.github.io/lith/
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  prerelease: auto
