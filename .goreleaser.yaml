# SPDX-License-Identifier: Apache-2.0
version: 2

project_name: lith

before:
  hooks:
    - go mod tidy

builds:
  - id: lith
    main: ./cmd/lith
    binary: lith
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/scttfrdmn/lith/internal/version.Version={{ .Version }}
      - -X github.com/scttfrdmn/lith/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/scttfrdmn/lith/internal/version.Date={{ .Date }}

archives:
  # Versioned tar.gz archives (the durable, reproducible artifact).
  - id: lith
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  # Stable-name raw binaries so the docs' copy-pasteable one-liner works
  # unchanged across releases (curl -L .../lith_linux_amd64 -o lith).
  - id: lith-binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# Distroless multi-arch image, built from the same binaries as the archives
# above (ids: [lith]) — not a second build path. dockers_v2 builds both
# platforms and pushes one manifest per tag. A prerelease gets ONLY its exact
# version tag: the floating `major.minor` and `latest` must keep pointing at the
# latest STABLE release, so both are guarded by `{{ if not .Prerelease }}` (the
# empty tag a prerelease yields is dropped).
dockers_v2:
  - id: lith
    images:
      - ghcr.io/scttfrdmn/lith
    ids: [lith]
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: lith
      org.opencontainers.image.description: Read-only FUSE-over-S3 filesystem and NFSv3 gateway
      org.opencontainers.image.source: https://github.com/scttfrdmn/lith
      org.opencontainers.image.url: https://github.com/scttfrdmn/lith
      org.opencontainers.image.documentation: https://scttfrdmn.github.io/lith/
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

# Linux packages (.deb / .rpm) from the SAME binaries as the archives and image
# — goreleaser bundles nfpm, so no extra tooling is needed, and both arches come
# from the build's goarch list. They attach to the release and enter checksums.txt.
nfpms:
  - id: lith
    package_name: lith
    ids: [lith]
    formats: [deb, rpm]
    maintainer: "Scott A Friedman <scttfrdmn@users.noreply.github.com>"
    description: "Read-only FUSE-over-S3 filesystem and NFSv3 gateway."
    homepage: "https://github.com/scttfrdmn/lith"
    license: "Apache-2.0"
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# An SBOM per archive and per package, via syft (installed in release.yml).
sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

# Keyless cosign signature over checksums.txt (Sigstore/OIDC) — signing the
# checksums transitively covers every artifact via its listed sha256. Requires
# cosign on PATH and id-token: write, both set in release.yml.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    output: true

changelog:
  disable: true

release:
  prerelease: auto
