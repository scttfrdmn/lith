site_name: lith
site_description: Read-only POSIX filesystem over an S3 bucket in its native key layout.
site_url: https://scttfrdmn.github.io/lith/
repo_url: https://github.com/scttfrdmn/lith
repo_name: scttfrdmn/lith
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/lith-logo.png
  favicon: assets/lith-logo.png
  # No CDN dependency: use the system font stack. To self-host Atkinson
  # Hyperlegible later, drop its .woff2 into docs/stylesheets/ and add an
  # @font-face rule to extra.css (see the note there); leave font: false so
  # Material never fetches Google Fonts.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details        # collapsible <details> blocks for evidence
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc: { permalink: true }

plugins:
  - search
  # not.md folded into scope.md; keep the published /not/ URL alive for
  # search-engine and bookmarked links.
  - redirects:
      redirect_maps:
        not.md: scope.md

nav:
  - Start here: index.md
  - What lith is for: scope.md
  - Copy or mount?: copy-or-mount.md
  - Sizing the node: sizing.md
  - Meet a deadline: deadline.md
  - CargoShip archives: cargoship.md
  - Published datasets: published-datasets.md
  - Serving a cluster: serving-a-cluster.md
  - Running in a container: running-in-a-container.md
  - Knobs: knobs.md
