# SPDX-License-Identifier: Apache-2.0
#
# The single source of truth for "does this commit pass?", called by both
# branch CI (ci.yml, on push/PR) and the release gate (release.yml, on a tag).
# There is exactly one definition of the gate, so a tag runs precisely what a PR
# runs — no more "the release gate is a subset of CI" drift (#199).
name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          # Must track the Go in go.mod. go1.27.2 writes export data VERSION 5 and v2.13.2
          # reads at most 4, so the lint could not import sync/atomic and failed every
          # package with a typecheck error -- which looks like a code problem and is not one.
          version: v2.14.0
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: fuzz the index parser (60s; committed corpus also runs above)
        run: go test -run '^$' -fuzz 'FuzzParseIndex$' -fuzztime 60s ./internal/index/
      - name: fuzz the bgzf index parsers (60s; committed corpora also run above)
        run: |
          go test -run '^$' -fuzz 'FuzzParseTBI$' -fuzztime 20s ./internal/format/bgzf/
          go test -run '^$' -fuzz 'FuzzParseCRAI$' -fuzztime 20s ./internal/format/bgzf/
          go test -run '^$' -fuzz 'FuzzParseBAI$' -fuzztime 20s ./internal/format/bgzf/
      - name: fuzz the footer parsers (60s; committed corpora also run above)
        run: |
          go test -run '^$' -fuzz 'FuzzParseParquetFooter$' -fuzztime 30s ./internal/format/footer/
          go test -run '^$' -fuzz 'FuzzParseZipCentralDir$' -fuzztime 30s ./internal/format/footer/

  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/lith

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Build the binaries into the same os/arch layout goreleaser (dockers_v2)
      # hands the Dockerfile, then build the image without pushing — a PR that
      # breaks the image (bad COPY, base bump) fails here, before any tag is cut.
      #
      # BOTH ARCHITECTURES, and deliberately WITHOUT docker/setup-qemu-action.
      # Two reasons, and the second is the point:
      #
      #  1. The gate built only linux/amd64 while the release publishes a
      #     two-platform manifest, so an arm64-only image problem could not fail
      #     until a tag was already cut.
      #  2. THIS IS THE EXPERIMENT THAT DECIDES WHETHER THE RELEASE NEEDS QEMU AT
      #     ALL. v1.12.0's release failed TWICE on Docker Hub's unauthenticated
      #     pull rate limit, at setup-qemu-action, before goreleaser did any work.
      #     But the Dockerfile has NO `RUN` instruction — it copies a prebuilt
      #     static binary into distroless — so BuildKit never has to execute
      #     target-architecture code, and emulation should be unnecessary. If this
      #     step passes on a runner with no binfmt handlers installed, that is
      #     proof, measured on the same runner image the release uses, and the
      #     release can drop its QEMU step and the Docker Hub pull with it.
      #
      # TARGETPLATFORM IS NOT PASSED AS A BUILD-ARG. BuildKit sets it automatically,
      # once per platform, which is what makes `COPY ${TARGETPLATFORM}/lith` pick the
      # right binary for each. Passing it explicitly -- as the old single-platform
      # step had to, because the classic builder does not set it -- would pin BOTH
      # images to the amd64 binary and the arm64 half of this check would prove
      # nothing.
      #
      # No --load either, so nothing has to be exported to the local image store,
      # which is single-platform.
      #
      # WHAT A PASS DOES AND DOES NOT PROVE: it proves setup-qemu-action is not
      # needed to build this image on this runner image -- either because no
      # emulation is required, or because the handlers are already ambient. Both
      # answer the question the release cares about. The binfmt listing above is
      # printed so the reason is visible rather than assumed.
      - name: build binaries into context
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            mkdir -p "linux/$arch"
            GOARCH="$arch" go build -trimpath -o "linux/$arch/lith" ./cmd/lith
          done
      - name: show installed binfmt handlers (expect none for arm64)
        run: ls -1 /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo "no binfmt_misc entries"
      - name: docker build, both platforms, no QEMU (no push)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t lith:ci .
