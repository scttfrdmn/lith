# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The release gate is the SAME reusable gate branch CI runs — vet, lint,
  # test -race, govulncheck, fuzz, dual-arch build, docker build (#199). A tag
  # pushed to a commit that does not pass the full gate produces no release
  # assets, because goreleaser depends on this job. (A tag push does not itself
  # trigger ci.yml, which runs on branch pushes and PRs.)
  gate:
    uses: ./.github/workflows/gate.yml

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      packages: write      # push the distroless image to GHCR
      id-token: write      # keyless cosign signing + provenance (OIDC)
      attestations: write  # SLSA build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # cosign (keyless signing) and syft (SBOM generation) must be on PATH for
      # the goreleaser `signs` and `sboms` blocks.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      # The release body comes from this tag's CHANGELOG.md section. goreleaser's
      # own changelog generation is disabled (the hand-written CHANGELOG is the
      # source of truth, not git log), and with nothing supplied in its place
      # every release from v0.5.0 on published an EMPTY body. This fails the
      # release when the section is missing, so a tag can never again ship
      # unannotated — add the `## [x.y.z]` section before tagging.
      - name: release notes from CHANGELOG
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          echo "--- release body for $GITHUB_REF_NAME ---"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: "v2.18.1"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the version to the tag that triggered this run, not `git describe`.
          # An rc and its stable tag legitimately sit on the same commit (same
          # code), and `git describe` then resolves ambiguously — v1.1.0's run
          # picked up v1.1.0-rc1, rebuilt the prerelease, and 422'd re-uploading to
          # the existing rc release. The triggering ref is unambiguous.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      # SLSA build-provenance for every shipped artifact (binaries, tarballs,
      # deb/rpm, checksums), attached to the GitHub attestations store and
      # verifiable with `gh attestation verify`.
      - name: attest build provenance (release artifacts)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/lith_*_linux_*.tar.gz
            dist/lith_linux_*
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      # The multi-arch image goreleaser just pushed also needs provenance — its
      # index digest is the attestation subject (verify with `gh attestation
      # verify oci://ghcr.io/scttfrdmn/lith@<digest>`).
      - name: resolve pushed image digest
        id: img
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "digest=$(docker buildx imagetools inspect ghcr.io/scttfrdmn/lith:"$ver" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - name: attest build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/scttfrdmn/lith
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true
      # Belt-and-braces on the step above: assert the published release actually
      # carries a body. The notes step can only catch a missing CHANGELOG section;
      # this catches the wiring itself regressing (a dropped --release-notes flag,
      # a goreleaser flag rename), which is how the empty bodies went unnoticed
      # across five releases.
      - name: verify the published body IS the CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "Non-empty" is too weak a check, and v1.2.0-rc.1 proved it from the other
          # side: with `changelog: disable: true` fighting `--release-notes` the body
          # came out as 2 bytes of whitespace, and had goreleaser instead fallen back
          # to generating from git log the body would have been non-empty and WRONG.
          # So assert the published body actually contains the notes we supplied.
          gh release view "$GITHUB_REF_NAME" --json body -q .body > /tmp/published-body.md
          n=$(wc -c < /tmp/published-body.md)
          if [ "$n" -lt 200 ]; then
            echo "::error::release $GITHUB_REF_NAME published with an empty or stub body ($n bytes)"
            exit 1
          fi
          # The first substantive line of the notes must appear in the body. This is
          # what distinguishes "our CHANGELOG section" from "goreleaser's git-log
          # changelog", which a length check cannot tell apart.
          probe=$(grep -m1 -E '^[A-Za-z*_`#]' "$RUNNER_TEMP/release-notes.md" | cut -c1-60)
          if [ -z "$probe" ]; then
            echo "::error::could not derive a probe line from the notes file"
            exit 1
          fi
          if ! grep -qF -- "$probe" /tmp/published-body.md; then
            echo "::error::published body does not contain the CHANGELOG notes"
            echo "::error::expected to find: $probe"
            echo "--- first 40 lines of what was actually published ---"
            head -40 /tmp/published-body.md
            exit 1
          fi
          echo "release body: $n bytes, and it contains the CHANGELOG section"
